# Push a tag like v1.0.0 to publish a GitHub release with the single-file app attached.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html "persoatlas-${GITHUB_REF_NAME}.html"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/index.html
            persoatlas-${{ github.ref_name }}.html
